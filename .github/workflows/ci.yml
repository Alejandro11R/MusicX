name: CI & Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Principio de mínimo privilegio: estrictamente solo lectura de código.
# Los forks de contribuidores externos NUNCA tienen acceso a tokens con permisos de escritura ni secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-lint:
    name: Lint & SAST Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libmpv-dev mpv

      # Seguridad de npm: jamás ejecutar scripts de ciclo de vida (preinstall/postinstall) automáticamente
      - name: Install npm dependencies securely
        run: npm ci --ignore-scripts

      - name: Lint Frontend
        run: npm run test

      - name: Build Frontend & Typecheck
        run: npm run build

      - name: Rust formatting check
        run: cd src-tauri && cargo fmt --all -- --check

      - name: Rust Clippy (SAST / Lint)
        run: cd src-tauri && cargo clippy --all-targets -- -D warnings

      - name: Rust Unit Tests
        run: cd src-tauri && cargo test --lib -- --test-threads=1

      - name: Run Rust Integration Tests (mpv + yt-dlp stub)
        run: |
          mkdir -p "$HOME/.config/mpv"
          printf 'ao=null\n' > "$HOME/.config/mpv/mpv.conf"
          cd src-tauri && cargo test --test integration -- --include-ignored --test-threads=1

      - name: Build Standalone Tauri App & CLI
        run: |
          npm run tauri build -- --no-bundle
          cd src-tauri && cargo build --release --bin cadence-cli

      - name: Upload Linux Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cadence-linux-x86_64
          path: |
            src-tauri/target/release/cadence
            src-tauri/target/release/cadence-cli
            src-tauri/icons/icon.png
          if-no-files-found: error
          retention-days: 14
